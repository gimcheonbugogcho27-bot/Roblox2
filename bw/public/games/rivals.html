<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RIVALS 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e17;--gl:rgba(16,22,36,.74);--bd:rgba(255,255,255,.11);--tx:#eaf0ff;--mu:#8793ad;--a:#38bdf8;--b:#a78bfa;--r:#fb5a6e;--g:#4ade80;--hd:'Rajdhani','Noto Sans KR',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e17}}
:root[data-theme="dark"]{--bg:#0a0e17}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;pointer-events:none}.ov>*{pointer-events:auto}
.gl{background:var(--gl);border:1px solid var(--bd);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px #0007}
.btn{font:700 18px var(--hd);letter-spacing:2px;color:#06101c;background:linear-gradient(135deg,var(--a),var(--b));border:0;border-radius:14px;padding:14px 38px;cursor:pointer;box-shadow:0 6px 24px #38bdf855,inset 0 1px 0 #fff6;transition:.15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn:active{transform:translateY(1px)}
.btn.s{background:#ffffff14;color:var(--tx);box-shadow:none;border:1px solid var(--bd);padding:10px 22px}
#ttl{position:fixed;top:14px;left:22px;margin:0;font:700 36px var(--hd);letter-spacing:7px;font-style:italic;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;pointer-events:none}
#hint{position:fixed;top:64px;left:22px;padding:7px 14px;font-size:12px;color:var(--mu);border-radius:999px}
#start{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:26px;padding:16px 70px}
#start:hover{transform:translateX(-50%) translateY(-1px)}#start:active{transform:translateX(-50%) translateY(1px)}
#sel{display:none;align-items:center;justify-content:center;background:#050810cc;backdrop-filter:blur(6px);z-index:30;pointer-events:auto}
#selc{width:min(980px,96vw);max-height:92vh;overflow:auto;padding:22px 24px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.hdr h2{margin:0;font:700 28px var(--hd);letter-spacing:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.hd{margin:0 0 10px;font:700 13px var(--hd);letter-spacing:3px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 18px;border-radius:12px;border:1px solid var(--bd);background:#ffffff0d;cursor:pointer;font:700 19px var(--hd);transition:.12s}
.chip:hover{background:#ffffff1c}.chip.on{background:linear-gradient(135deg,#38bdf833,#a78bfa33);border-color:var(--a);color:#fff;box-shadow:0 0 18px #38bdf833}
.wc{padding:11px 13px;border-radius:13px;border:1px solid var(--bd);background:#ffffff08;margin-bottom:9px;cursor:pointer;transition:.12s}
.wc:hover{background:#ffffff14}.wc.on{border-color:var(--a);background:#38bdf814;box-shadow:0 0 0 1px var(--a) inset}
.wt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.wt b{font:700 19px var(--hd);letter-spacing:1px}.wt small{color:var(--mu);font-size:11px}
.st{display:grid;grid-template-columns:34px 1fr;gap:3px 8px;align-items:center;font:700 10px var(--hd);color:var(--mu);letter-spacing:1px}
.st u{text-decoration:none}.st s{display:block;height:5px;border-radius:3px;background:#ffffff14;overflow:hidden}.st i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}
.mc{height:66px;border-radius:13px;margin-bottom:8px;cursor:pointer;border:2px solid transparent;display:flex;align-items:flex-end;justify-content:space-between;padding:8px 12px;font:700 18px var(--hd);box-shadow:inset 0 -44px 30px #000b;transition:.12s}
.mc small{font:400 11px 'Noto Sans KR';color:#ddd}.mc.on{border-color:#fff;box-shadow:inset 0 -44px 30px #000b,0 0 20px #fff4}
.sw{display:inline-block;width:32px;height:32px;border-radius:10px;margin:0 8px 6px 0;cursor:pointer;border:3px solid transparent}.sw.on{border-color:#fff;box-shadow:0 0 12px #fff6}
.ft{display:flex;justify-content:center;margin-top:12px}.ft .btn{font-size:22px;padding:15px 60px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
#hud{display:none}#hud>*{pointer-events:none}
#cross{position:fixed;left:50%;top:50%;width:0;height:0}#cross i{position:absolute;background:#fff;box-shadow:0 0 3px #000;transition:.08s}#cross.hit i{background:var(--r);transform:scale(1.5)}
#score{position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:8px 22px;display:flex;gap:16px;align-items:center;font:700 28px var(--hd);border-radius:999px}
#score small{font-size:13px;color:var(--mu);letter-spacing:2px}
#tgt{position:fixed;top:64px;left:50%;transform:translateX(-50%);padding:8px 16px;width:260px;text-align:center;font:700 14px var(--hd);letter-spacing:1px;opacity:0;transition:.2s}
.bar{height:8px;background:#ffffff1c;border-radius:5px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;transition:width .15s}
#tb{background:linear-gradient(90deg,var(--r),#fbbf24)}#hpb{background:linear-gradient(90deg,var(--g),#a3e635)}
#feed{position:fixed;top:14px;left:20px;font:700 14px var(--hd);letter-spacing:1px}#feed div{background:#0009;border-left:3px solid var(--r);padding:5px 10px;margin-bottom:4px;border-radius:4px}
#hpw{position:fixed;left:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:250px;padding:12px 16px}
#hpw small,#info small{font:700 11px var(--hd);letter-spacing:3px;color:var(--mu)}#hpw b{display:block;font:700 38px var(--hd);line-height:1}
#info{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));padding:12px 18px;text-align:right}#info b{display:block;font:700 38px var(--hd);line-height:1}
#msg{position:fixed;top:28%;left:0;right:0;text-align:center;font:700 72px var(--hd);letter-spacing:8px;text-shadow:0 4px 18px #000}
#dmg{position:fixed;inset:0;background:radial-gradient(transparent 45%,#f00a);opacity:0;transition:opacity .25s}
.dn{position:fixed;z-index:15;font:700 22px var(--hd);color:#fff;text-shadow:0 2px 6px #000;pointer-events:none;animation:up .8s forwards;transform:translate(-50%,-50%)}.dn.h{color:#ffd23f;font-size:30px}
@keyframes up{to{margin-top:-60px;opacity:0}}
#pause{align-items:center;justify-content:center;background:#050810bb;backdrop-filter:blur(5px);z-index:30;pointer-events:auto;text-align:center}
.pc{padding:30px 40px}.pc h2{margin:0 0 18px;font:700 46px var(--hd);letter-spacing:6px}.pc .row{display:flex;gap:12px;justify-content:center}.pc small{display:block;margin-top:14px;color:var(--mu)}
#nbtn{position:fixed;top:12px;right:12px;z-index:60;padding:7px 14px;font:700 13px var(--hd);letter-spacing:3px;border-radius:999px;border:1px solid #fb5a6e88;background:#fb5a6e33;color:#ffb3bd;cursor:pointer;backdrop-filter:blur(8px)}
.nw{position:fixed;z-index:70;top:50%;left:50%;transform:translate(-50%,-50%);display:none;width:min(320px,92vw);max-height:90vh;overflow:auto;padding:20px;text-align:center}
.nw h3{margin:0 0 12px;font:700 22px var(--hd);letter-spacing:5px;color:#ffb3bd}
#npw input{width:100%;padding:11px;font-size:22px;text-align:center;border-radius:10px;border:1px solid var(--bd);background:#0008;color:var(--tx);margin:6px 0 12px;letter-spacing:8px}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;margin:6px 0;cursor:pointer;font-weight:700;font-size:14px;text-align:left}
.tg small{display:block;color:var(--mu);font-weight:400;font-size:10px}
.tg i{width:40px;height:22px;border-radius:12px;background:#ffffff22;position:relative;flex:none;transition:.15s}.tg i:after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.tg.on{border-color:var(--g)}.tg.on i{background:var(--g)}.tg.on i:after{left:21px}
#tc{display:none;position:fixed;inset:0;z-index:20;pointer-events:none}#tc>*{pointer-events:auto;position:absolute;touch-action:none}
#joy{left:24px;bottom:calc(120px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:#ffffff18;border:2px solid #fff4}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#ffffff88}
.tb{width:62px;height:62px;border-radius:50%;background:#ffffff2a;border:2px solid #fff5;color:#fff;font:700 15px var(--hd);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#bf{right:26px;bottom:130px;width:86px;height:86px;background:#fb5a6e88}#bj{right:124px;bottom:150px}#br{right:20px;bottom:236px}#bd{right:124px;bottom:224px;display:none}#pb{right:12px;top:50px;width:44px;height:44px}
#bs{right:20px;bottom:312px}#bu{right:124px;bottom:304px}.chip small{display:block;font:400 10px 'Noto Sans KR';color:var(--mu)}.ud{font-size:11px;color:var(--mu)}#wl{max-height:52vh;overflow:auto;padding-right:4px}#tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
#tc.lobby .tb{display:none}#tc.lobby #joy{bottom:calc(110px + env(safe-area-inset-bottom,0px))}
</style></head><body>
<h1 id="ttl">RIVALS</h1>
<div class="ov" id="ll"><div class="gl" id="hint">WASD / 조이스틱 이동 · 드래그로 시점 회전</div><button class="btn" id="start">▶ START</button></div>
<div class="ov" id="sel"><div class="gl" id="selc">
 <div class="hdr"><h2>MATCH SETUP</h2><button class="btn s" id="cancel">✕</button></div>
 <div class="grid">
  <div><p class="hd">OPPONENTS</p><div class="chips" id="opc"></div><p class="hd" style="margin-top:20px">SKIN</p><div id="cl"></div><p class="hd" style="margin-top:14px">ARENA</p><div id="ml"></div></div>
  <div><p class="hd">LOADOUT</p><div id="tabs"></div><div id="wl"></div></div>
 </div>
 <div class="ft"><button class="btn" id="play">⚔ 전투 시작</button></div></div></div>
<div class="ov" id="hud">
 <div id="dmg"></div>
 <div id="cross"><i style="left:-15px;top:-1px;width:9px;height:2px"></i><i style="left:6px;top:-1px;width:9px;height:2px"></i><i style="left:-1px;top:-15px;width:2px;height:9px"></i><i style="left:-1px;top:6px;width:2px;height:9px"></i></div>
 <div id="score" class="gl"></div>
 <div id="tgt" class="gl"><span id="tn"></span><div class="bar"><i id="tb" style="width:100%"></i></div></div>
 <div id="feed"></div>
 <div id="hpw" class="gl"><small>HEALTH</small><b id="hpn">100</b><div class="bar"><i id="hpb" style="width:100%"></i></div></div>
 <div id="info" class="gl"><small id="wn"></small><b id="am"></b><small id="un" style="display:block;margin-top:6px"></small></div>
 <div id="msg"></div>
</div>
<div class="ov" id="pause" style="display:none"><div class="gl pc"><h2 id="ptitle">PAUSED</h2><div class="row"><button class="btn" id="resume">계속하기</button><button class="btn s" id="exit">로비로</button></div><small>클릭하면 마우스가 고정됩니다</small></div></div>
<button id="nbtn">NOSNIY</button>
<div id="npw" class="gl nw"><h3>NOSNIY</h3><input id="pwi" type="password" inputmode="numeric" maxlength="8" placeholder="PASSWORD"><div style="display:flex;gap:8px;justify-content:center"><button class="btn" id="pwok" style="padding:10px 26px">확인</button><button class="btn s" id="pwx">닫기</button></div></div>
<div id="nos" class="gl nw"><h3>NOSNIY PANEL</h3><div id="ntg"></div><div class="tg" style="display:block;cursor:default"><span>총 대미지<small>0 = 기본 · 최대 1000 (발당)</small></span><div style="display:flex;gap:10px;align-items:center;margin-top:8px"><input type="range" id="dsl" min="0" max="1000" step="10" value="0" style="flex:1;accent-color:#fb5a6e;touch-action:pan-x"><b id="dv" style="min-width:48px;font:700 20px var(--hd)">기본</b></div></div><p class="hd" style="margin:12px 0 8px">OPPONENTS</p><div class="chips" id="nchips" style="justify-content:center"></div><button class="btn s" id="nx" style="margin-top:14px">닫기</button></div>
<div id="tc" class="lobby"><div id="joy"><div id="knob"></div></div><div class="tb" id="bf">FIRE</div><div class="tb" id="bj">JUMP</div><div class="tb" id="bd">DOWN</div><div class="tb" id="br">RELOAD</div><div class="tb" id="bs">SWAP</div><div class="tb" id="bu">UTIL</div><div class="tb" id="pb">II</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const W={
 pistol:{n:'권총',d:'정확 · 반자동',dmg:25,rate:280,mag:12,rel:1100,sp:.006,pel:1,auto:0,rng:200,s:[30,45,60]},
 rifle:{n:'돌격소총',d:'연사형 주력',dmg:18,rate:100,mag:30,rel:1700,sp:.015,pel:1,auto:1,rng:200,s:[24,92,70]},
 shotgun:{n:'샷건',d:'근접 폭딜',dmg:13,rate:800,mag:6,rel:2200,sp:.07,pel:8,auto:0,rng:35,s:[90,25,22]},
 sniper:{n:'저격총',d:'한 방 승부',dmg:90,rate:1200,mag:5,rel:2400,sp:0,pel:1,auto:0,rng:300,s:[100,14,100]},
 knife:{n:'칼',d:'근접 · 빠른 이동',dmg:55,rate:450,mag:999,rel:0,sp:0,pel:1,auto:0,rng:3.4,s:[55,60,5]}
};
const MAPS={
 ind:{n:'공장 지대',d:'콘크리트',sky:0x7f9bb5,gr:0x5b5f66,wl:0x7a7f88,bx:[0xd9822b,0x4a7fb5,0x8d8d8d],th:'linear-gradient(135deg,#5b5f66,#d9822b)'},
 neon:{n:'네온 시티',d:'사이버',sky:0x0a0620,gr:0x14102a,wl:0x2a1f55,bx:[0xff2bd6,0x20e6ff,0x8a5bff],em:1,th:'linear-gradient(135deg,#14102a,#ff2bd6 60%,#20e6ff)'},
 desert:{n:'사막 유적',d:'석조 유적',sky:0xf0c78a,gr:0xd8b878,wl:0xb68a52,bx:[0xc99a5b,0xa87b44,0xe0b878],th:'linear-gradient(135deg,#d8b878,#c99a5b 60%,#f0c78a)'}
};
const SK=[0x2f7bff,0xff4a4a,0x38c172,0xb35cff,0xffa11c,0x14b8a6];
let weapon='rifle',mapK='ind',shirt=SK[0],botN=1,mode='lobby';
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(R.domElement);
const lcam=new THREE.PerspectiveCamera(42,1,.1,200),cam=new THREE.PerspectiveCamera(80,1,.05,300);
function rs(){R.setSize(innerWidth,innerHeight);[lcam,cam].forEach(c=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix()})}
addEventListener('resize',rs);
const mat=(c,e)=>new THREE.MeshLambertMaterial(Object.assign({color:c},e?{emissive:c,emissiveIntensity:.55}:{}));
const box=(w,h,d,c,e)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,e));
function lights(s,r){s.add(new THREE.HemisphereLight(0xffffff,0x556070,.8));const d=new THREE.DirectionalLight(0xffffff,.85);d.position.set(14,30,10);d.castShadow=true;d.shadow.mapSize.set(1024,1024);const c=d.shadow.camera;c.left=c.bottom=-r;c.right=c.top=r;c.far=90;s.add(d)}
function makeGun(t){const g=new THREE.Group(),k=0x2a2a2e;
 const a=(w,h,d,x,y,z,c)=>{const m=box(w,h,d,c||k);m.position.set(x,y,z);g.add(m)};
 if(t=='pistol'){a(.08,.12,.3,0,0,0);a(.07,.16,.09,0,-.12,.08);a(.05,.05,.1,0,.03,-.2,0x777777)}
 else if(t=='rifle'){a(.09,.13,.7,0,0,0);a(.05,.05,.35,0,.02,-.5,0x777777);a(.07,.2,.09,0,-.15,.1);a(.07,.1,.2,0,-.02,.4,0x6b4a2a);a(.04,.06,.1,0,.1,-.1,0x111111)}
 else if(t=='shotgun'){a(.1,.1,.8,0,0,0,0x6b4a2a);a(.06,.06,.55,0,.06,-.5,0x777777);a(.08,.1,.3,0,-.01,.5,0x6b4a2a)}
 else if(t=='sniper'){a(.08,.12,.9,0,0,0,0x2c3b2c);a(.04,.04,.6,0,.02,-.7,0x777777);a(.05,.07,.28,0,.12,-.05,0x111111)}
 else if(t=='smg'){a(.08,.13,.42,0,0,0);a(.04,.04,.2,0,.02,-.3,0x777777);a(.06,.2,.08,0,-.15,.05)}else if(t=='lmg'){a(.11,.15,.8,0,0,0,0x3a3f35);a(.05,.05,.4,0,.02,-.6,0x777777);a(.16,.16,.2,0,-.1,.1,0x2a2a2e);a(.07,.1,.2,0,-.02,.45,0x3a3f35)}
 else{a(.05,.08,.16,0,0,0,0x5a3a1a);a(.025,.06,.55,0,.02,-.35,0xdddddd)}
 return g}
function makeChar(col,hair){const g=new THREE.Group(),skin=0xf2c48d,hc=hair||0x2b1d12;
 const part=(n,w,h,d,x,y,z,c)=>{const m=box(w,h,d,c);m.position.set(x,y,z);m.name=n;m.castShadow=true;g.add(m)};
 part('body',.95,1,.5,0,1.4,0,col);part('belt',.97,.12,.52,0,.95,0,0x222a36);
 part('head',.62,.62,.62,0,2.22,0,skin);part('hair',.66,.2,.66,0,2.58,0,hc);part('hairb',.66,.42,.12,0,2.36,.27,hc);
 part('l1',.45,.9,.45,-.24,.45,0,0x2b3a55);part('r1',.45,.9,.45,.24,.45,0,0x2b3a55);
 [-.15,.15].forEach(x=>{const e=box(.1,.12,.02,0x111111);e.position.set(x,2.24,-.32);g.add(e)});
 const mo=box(.24,.05,.02,0x7a2e2e);mo.position.set(0,2.08,-.32);g.add(mo);
 const arm=(x,a)=>{const p=new THREE.Group();p.position.set(x,1.85,0);const m=box(.4,1,.4,skin);m.position.y=-.5;m.castShadow=true;p.add(m);const s=box(.42,.5,.42,col);s.position.y=-.25;p.add(s);p.rotation.x=a;g.add(p)};
 arm(-.7,.3);arm(.7,1.45);
 g.scale.setScalar(.8);g.traverse(o=>{if(o.isMesh)o.userData.part=o.name||'arm'});return g}
function setGun(ch,t){if(ch.userData.gun)ch.remove(ch.userData.gun);const gn=makeGun(t);gn.position.set(.7,1.5,-.45);ch.add(gn);ch.userData.gun=gn}
// ---------- lobby
const LS=new THREE.Scene(),LR=18;lights(LS,26);
const lfl=new THREE.Mesh(new THREE.CircleGeometry(LR,48),mat(0x555555));lfl.rotation.x=-Math.PI/2;lfl.position.y=-.02;lfl.receiveShadow=true;LS.add(lfl);
const pod=new THREE.Mesh(new THREE.CylinderGeometry(2,2,.06,40),mat(0x38bdf8,1));pod.position.y=.01;LS.add(pod);
for(let i=0;i<16;i++){const a=i/16*6.283,h=2+(i%3)*1.5,b=box(2.4,h,2.4,[0xff4a4a,0x2f7bff,0xffa11c,0x38c172][i%4]);b.position.set(Math.sin(a)*(LR+2),h/2,Math.cos(a)*(LR+2));b.castShadow=true;LS.add(b)}
let lch;function rebuildLobbyChar(){if(lch)LS.remove(lch);lch=makeChar(shirt);setGun(lch,weapon);LS.add(lch)}
function lobbyBg(){const m=MAPS[mapK];LS.background=new THREE.Color(m.sky);LS.fog=new THREE.Fog(m.sky,14,60);lfl.material.color.set(m.gr);pod.material.color.set(m.bx[1]);pod.material.emissive.set(m.bx[1])}
const sel=(o,k)=>o?' on':'';
function ui(){
 const chips=n=>[1,2,3,4,5].map(i=>`<div class="chip${i==botN?' on':''}" data-n="${i}">1 v ${i}</div>`).join('');

 function tag(name){var c=document.createElement('canvas');c.width=512;c.height=96;var x=c.getContext('2d');x.fillStyle='rgba(8,12,24,.82)';x.fillRect(8,8,496,80);x.font='bold 42px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.fillText(String(name||'플레이어').slice(0,16),256,49);var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));sp.scale.set(3.1,.58,1);sp.position.y=3.5;return sp}
 function ensure(p){var r=remotes.get(p.id);if(!r){var g=makeChar(0x38bdf8,0x222a55);setGun(g,'rifle');g.add(tag(p.name));r={g:g,target:p,seen:Date.now()};remotes.set(p.id,r)}if(GS&&r.g.parent!==GS){if(r.g.parent)r.g.parent.remove(r.g);GS.add(r.g)}return r}
 window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='bw2:remote'||!d.player||d.player.game!=='rivals')return;var r=ensure(d.player);r.target=d.player;r.seen=Date.now()});
 setInterval(function(){try{if(typeof P==='undefined'||!P||mode!=='game'||!GS)return;var now=Date.now();if(now-lastSend>100){lastSend=now;parent.postMessage({type:'bw2:position',x:P.x,y:P.y,z:P.z,rotation:P.yaw||0},'*')}remotes.forEach(function(r,id){var t=r.target;if(GS&&r.g.parent!==GS){if(r.g.parent)r.g.parent.remove(r.g);GS.add(r.g)}r.g.position.lerp(new THREE.Vector3(t.x,t.y,t.z),.55);r.g.rotation.y=Number(t.rotation)||0;if(now-r.seen>4500){if(r.g.parent)r.g.parent.remove(r.g);remotes.delete(id)}})}catch(err){}},100);
})();
</script>
</body></html>
