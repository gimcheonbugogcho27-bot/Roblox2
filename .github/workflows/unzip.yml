
name: Automatically Extract ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o BlockWorld-speed-v3-cloudflare-realtime.zip -d .

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bw
          if ! git diff --cached --quiet; then
            git commit -m "Automatically extract BlockWorld ZIP"
            git push
          fi
