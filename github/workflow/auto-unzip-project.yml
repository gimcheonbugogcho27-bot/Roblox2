
name: Auto extract uploaded project ZIP

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=( *.zip )
          if (( ${#archives[@]} == 0 )); then
            echo "No ZIP files found; nothing to extract."
            exit 0
          fi
          for archive in "${archives[@]}"; do
            echo "Extracting: $archive"
            unzip -o "$archive" -d .
            rm "$archive"
          done

      - name: Commit extracted project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Automatically extract uploaded project ZIP"
            git push
          fi
